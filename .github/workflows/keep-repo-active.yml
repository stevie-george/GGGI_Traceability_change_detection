name: keep-repo-active

# Hace un pequeño commit semanal para que el repositorio no acumule 60 días
# sin actividad. Sin esto, GitHub pausa automáticamente TODOS los workflows
# programados del repo (incluido keep-alive) y la app volvería a dormirse.

on:
  schedule:
    - cron: "17 6 * * 1"   # cada lunes ~06:17 UTC
  workflow_dispatch: {}     # ejecución manual desde la pestaña Actions

permissions:
  contents: write            # necesario para que el bot pueda hacer push

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Actualizar marca de tiempo y commitear
        run: |
          STAMP="$(date -u +'%Y-%m-%d %H:%M:%SZ')"
          echo "Última actividad automática: $STAMP" > .github/keep-alive/last-run.txt
          git config user.name  "keep-alive-bot"
          git config user.email "actions@github.com"
          git add .github/keep-alive/last-run.txt
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "chore: keep repo active [skip ci]"
            git push
          fi
